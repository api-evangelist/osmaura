note: >-
  Osmaura does NOT use RFC 9457 application/problem+json. Every error is returned
  as application/json carrying a single, closed envelope object. The envelope is
  declared in the OpenAPI as components/schemas/Error with additionalProperties
  false at both levels, so the shape is fixed: an `error` object with exactly a
  string `code` and a string `message`. Statuses and meanings below are published
  in the provider's own error table; the `code` values are only partially
  published — `unauthorized` and `not_found` were observed/published verbatim,
  the rest are left null rather than guessed.
envelope:
  media_type: application/json
  shape: |
    {
      "error": {
        "code": "string",
        "message": "string"
      }
    }
  fields:
  - name: error.code
    type: string
    required: true
    description: Stable machine-readable error identifier.
  - name: error.message
    type: string
    required: true
    description: Human-readable explanation.
  additional_properties: false
