- name: Coverage
  role: audit
  description: What was checked, how fresh it was, and what is known to be missing.
  key_fields: [generated_at, data_through, sources, identity_warnings, known_gaps]
  note: Explicitly distinguishes zero from unknown from not-checked.
- name: SourceCoverage
