- The whole surface is read-only. There is no write, no side effect, and no cost-per-call to guard.
- >-
    An agent must respect the provider's data/analysis separation: fields under
    `data` are observed records with an official source link, fields under
    `analysis` are analyst conclusions and must not be restated as fact.
- >-
    Poll with If-None-Match. A new edition appears on a publication cadence, not
    continuously, so re-fetching an unchanged edition wastes the call.
