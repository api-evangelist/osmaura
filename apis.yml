name: Osmaura
description: >-
  Osmaura is a Y Combinator (Summer 2026) startup building opportunity
  intelligence for corporate law firms. It monitors public web signals, the
  government record, and a firm's own context to identify companies approaching a
  legal need before they begin looking for outside counsel, then briefs the right
  partner on why the moment may matter. Coverage centers on regulatory change,
  market movement such as hiring and funding, litigation activity, and company
  milestones, mapped to practice areas including immigration, startups, and
  commercial litigation. Osmaura ships a production REST API — the Osmaura
  Prospect API — documented publicly with an OpenAPI 3.1 definition. It returns
  dated, human-reviewed "editions" of ranked prospect dossiers that deliberately
  keep source-backed data separate from analyst conclusions, and every
  government-derived record carries an official link, a reproducible record
  locator, and a data-through date. Access is bearer-key authenticated, scoped to
  one organization, gated behind a $1,000/month plan, and reached through a
  private invitation link. Founded by MIT graduates Kali Abeje and Jity
  Woldemichael.
