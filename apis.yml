name: Osmaura
description: >-
  Osmaura is a Y Combinator (Summer 2026) startup building an AI-powered business
  development platform for corporate law firm partners. Its agents monitor the web,
  news, social media, and a firm's internal context to surface targeted new-matter
  opportunities, then recommend tailored outreach strategies. The platform works in
  three stages: building partner profiles from practice areas and networks, identifying
  prospective clients and their legal needs from external data sources, and suggesting
  engagement approaches for each opportunity. Founded by MIT graduates Kali Abeje and
  Jity Woldemichael. As of this profile the company publishes only a marketing landing
  page and a booking link — no public API, developer portal, documentation, or SDKs
  exist yet. Added to the API Evangelist network as a portfolio lead awaiting an API
  surface to enrich.
