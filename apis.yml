apis:
- name: Osmaura Prospect API
  description: >-
    A read-only REST API returning tenant-scoped, human-reviewed prospect
    editions. Each edition is a dated, ranked batch of prospect dossiers (20 in a
    normal edition) split into normalized identity, observed government and
    company records with mandatory source provenance, labeled analyst conclusions
    including rank and a dated why-now narrative, and a coverage block recording
    what was checked and what is known to be missing. Version 2 is current;
    version 1 remains available for existing integrations and is marked
    deprecated in the specification. Authentication is a tenant-scoped bearer key;
    responses carry an ETag for conditional polling.
